<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAY // MAYDAY — TigerGraph Fraud Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #333333; }
    ::-webkit-scrollbar-thumb:hover { background: #555555; }
  </style>
</head>
<body class="bg-black text-white">
  <div id="root" class="h-screen w-screen flex flex-col justify-between"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // Helper cn
    function cn(...classes) {
      return classes.filter(Boolean).join(" ");
    }

    // ----------------------------------------------------------------------
    // Sub-components & Icons
    // ----------------------------------------------------------------------
    function MorphingText({ text }) {
      return <span>{text}</span>;
    }

    function ArrowUpIcon() {
      return (
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 12V2M7 2L2.5 6.5M7 2L11.5 6.5" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    }

    function MicIcon() {
      return (
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="5" y="1" width="4" height="7" rx="2" stroke="currentColor" strokeWidth="1.5" />
          <path d="M2.75 6.5V7a4.25 4.25 0 0 0 8.5 0v-.5M7 11.25V13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
        </svg>
      );
    }

    function StopIcon() {
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" fill="currentColor" />
        </svg>
      );
    }

    function PlusIcon() {
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 2.5V11.5M2.5 7H11.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
        </svg>
      );
    }

    function DynamicBarsIcon({ level }) {
      const isMediumOrHigh = level === "Medium" || level === "Max Effort";
      const isHigh = level === "Max Effort";
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="1.5" y="8" width="2.5" height="4.5" rx="1" fill="currentColor" opacity={1} />
          <rect x="5.75" y="5" width="2.5" height="7.5" rx="1" fill="currentColor" opacity={isMediumOrHigh ? 1 : 0.3} />
          <rect x="10" y="2" width="2.5" height="10.5" rx="1" fill="currentColor" opacity={isHigh ? 1 : 0.3} />
        </svg>
      );
    }

    // ----------------------------------------------------------------------
    // The Centered AI Chat Input Component (21st.dev @jahed/ai-chat-input)
    // Monochromatic Anti-Slop Adaptation
    // ----------------------------------------------------------------------
    function PromptInput({ onSubmit, placeholder = "Investigate case, e.g. HHG-001 or ask MAY..." }) {
      const [expanded, setExpanded] = useState(false);
      const [value, setValue] = useState("");
      const [selectedModel, setSelectedModel] = useState("TigerGraph GSQL");
      const [effortIndex, setEffortIndex] = useState(1);
      const [isModelSelectOpen, setIsModelSelectOpen] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [audioData, setAudioData] = useState(new Array(5).fill(0));

      const models = ["TigerGraph GSQL", "GraphRAG Reasoner", "FinCEN Policy Engine", "Louvain Community"];
      const efforts = ["Fast Triage", "Deep Graph Walk", "Max Corroboration"];

      const textareaRef = useRef(null);
      const containerRef = useRef(null);

      const hasValue = value.trim() !== "";

      const expand = () => setExpanded(true);

      const handleSubmit = () => {
        if (!hasValue) return;
        onSubmit(value, { model: selectedModel, effort: efforts[effortIndex] });
        setValue("");
        setExpanded(false);
      };

      const cycleEffort = (e) => {
        e.stopPropagation();
        setEffortIndex((prev) => (prev + 1) % efforts.length);
      };

      const onActionButtonClick = (e) => {
        e.preventDefault();
        if (isRecording) {
          setIsRecording(false);
        } else if (hasValue) {
          handleSubmit();
        } else {
          setIsRecording(true);
          setTimeout(() => setIsRecording(false), 2500);
        }
      };

      return (
        <div
          ref={containerRef}
          className="relative flex flex-col w-full mx-auto"
          style={{
            maxWidth: expanded ? 560 : 380,
            transition: "max-width 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)",
          }}
        >
          {/* Main Input Card - Strict Monochromatic Black/White */}
          <div
            onMouseDown={(e) => {
              if (expanded && e.target !== textareaRef.current) {
                e.preventDefault();
                textareaRef.current?.focus();
              }
            }}
            style={{
              borderRadius: 16,
              height: expanded ? 120 : 48,
              transition: "height 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)",
            }}
            className={cn(
              "relative w-full border border-[#333333] bg-[#0a0a0a] shadow-none hover:border-[#666666] focus-within:border-white transition-colors",
              expanded ? "cursor-text" : "cursor-default"
            )}
          >
            <textarea
              ref={textareaRef}
              value={value}
              onChange={(e) => setValue(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  handleSubmit();
                }
                if (e.key === "Escape") {
                  setExpanded(false);
                }
              }}
              placeholder={placeholder}
              className={cn(
                "absolute top-0 inset-x-0 w-full resize-none bg-transparent pl-4 pr-12 py-3 text-xs leading-[20px] text-white outline-none placeholder:text-[#555555]",
                expanded ? "opacity-100" : "opacity-0 pointer-events-none"
              )}
            />

            <button
              type="button"
              onClick={expand}
              className={cn(
                "absolute inset-x-0 top-0 pl-4 pr-12 py-3 text-left text-xs text-[#777777] outline-none",
                !expanded ? "opacity-100" : "opacity-0 pointer-events-none"
              )}
            >
              {placeholder}
            </button>

            {/* Bottom Actions Bar */}
            <div
              className={cn(
                "absolute bottom-2 left-3 right-12 flex items-center gap-1.5 transition-opacity duration-200",
                expanded && !isRecording ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"
              )}
            >
              {/* Model Pill */}
              <div className="relative">
                <button
                  type="button"
                  onClick={() => setIsModelSelectOpen(!isModelSelectOpen)}
                  className="flex items-center gap-1 border border-[#333333] hover:border-white bg-black px-2 py-0.5 rounded text-[10px] text-[#aaaaaa] hover:text-white transition"
                >
                  <span className="font-mono">{selectedModel}</span>
                </button>

                {isModelSelectOpen && (
                  <div className="absolute bottom-full left-0 mb-1.5 z-50 w-48 border border-[#333333] bg-black p-1 shadow-2xl flex flex-col gap-1">
                    {models.map((m) => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => {
                          setSelectedModel(m);
                          setIsModelSelectOpen(false);
                        }}
                        className="text-left text-[10px] px-2 py-1 text-[#888888] hover:text-black hover:bg-white transition"
                      >
                        {m}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              {/* Effort Button */}
              <button
                type="button"
                onClick={cycleEffort}
                className="flex items-center gap-1 border border-[#333333] hover:border-white bg-black px-2 py-0.5 rounded text-[10px] text-[#aaaaaa] hover:text-white transition"
              >
                <DynamicBarsIcon level={efforts[effortIndex]} />
                <span className="font-mono">{efforts[effortIndex]}</span>
              </button>
            </div>

            {/* Send / Mic Button */}
            <button
              type="button"
              onClick={onActionButtonClick}
              className="absolute right-2 bottom-2 size-8 flex items-center justify-center bg-white text-black hover:bg-[#cccccc] transition rounded"
            >
              {hasValue ? <ArrowUpIcon /> : <MicIcon />}
            </button>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------------------------
    // Main Application: MAY by MAYDAY
    // ----------------------------------------------------------------------
    function App() {
      const [activeCase, setActiveCase] = useState(null);
      const [loading, setLoading] = useState(false);
      const [logHistory, setLogHistory] = useState([]);

      const handleQuery = async (queryText) => {
        setLoading(true);
        // Extract case ID if mentioned (e.g. HHG-001 or 001)
        const match = queryText.match(/HHG-\d{3}/i) || queryText.match(/\b\d{1,2}\b/);
        let caseId = "HHG-001";
        if (match) {
          const raw = match[0].toUpperCase();
          caseId = raw.startsWith("HHG-") ? raw : `HHG-${raw.padStart(3, '0')}`;
        }

        try {
          const res = await fetch(`/api/cases/${caseId}`);
          if (!res.ok) throw new Error("Case not found");
          const data = await res.json();
          setActiveCase(data);
          setLogHistory((prev) => [
            { query: queryText, caseId: data.case_id, verdict: data.case.verdict, data },
            ...prev
          ]);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex flex-col h-full justify-between p-6">
          
          {/* Top Bar: MAY & MAYDAY */}
          <div className="flex items-center justify-between border-b border-[#222222] pb-3">
            <div className="flex items-center gap-3">
              <span className="text-xl font-bold tracking-widest text-white">MAY</span>
              <span className="text-xs border border-[#333333] px-2 py-0.5 text-[#888888] font-bold">TEAM: MAYDAY</span>
            </div>
            <div className="text-[10px] text-[#666666] tracking-wider uppercase">
              TigerGraph Savanna Knowledge Graph // HHGOA 2026
            </div>
          </div>

          {/* Center Area: Chat Input & Active Investigation Output */}
          <div className="flex-1 flex flex-col items-center justify-center max-w-3xl mx-auto w-full py-4">
            
            {/* Title / Identity */}
            <div className="text-center mb-6">
              <h1 className="text-2xl font-bold tracking-tight text-white mb-1">
                AGENTIC FRAUD INVESTIGATION
              </h1>
              <p className="text-xs text-[#666666]">
                Autonomous graph traversal, uncertainty quantification, and next-best actions
              </p>
            </div>

            {/* The 21st.dev Component */}
            <div className="w-full flex justify-center mb-6">
              <PromptInput onSubmit={(val) => handleQuery(val)} />
            </div>

            {/* Quick Action Case Triggers */}
            <div className="flex flex-wrap gap-2 justify-center max-w-lg mb-6">
              {[
                { label: "HHG-001 (Travel False Alarm)", id: "HHG-001" },
                { label: "HHG-014 (Proxy Syndicate Ring)", id: "HHG-014" },
                { label: "HHG-006 (CNP New Device)", id: "HHG-006" },
                { label: "HHG-003 (Card Testing Burst)", id: "HHG-003" }
              ].map((btn) => (
                <button
                  key={btn.id}
                  onClick={() => handleQuery(`Investigate ${btn.id}`)}
                  className="text-[10px] border border-[#222222] hover:border-white bg-[#0a0a0a] text-[#888888] hover:text-white px-2.5 py-1 transition"
                >
                  [ {btn.label} ]
                </button>
              ))}
            </div>

            {/* Active Output Dossier */}
            {activeCase && (
              <div className="w-full border border-[#222222] bg-[#050505] p-4 text-xs font-mono max-h-72 overflow-y-auto">
                <div className="flex items-center justify-between border-b border-[#222222] pb-2 mb-3">
                  <div>
                    <span className="font-bold text-white text-sm">{activeCase.case_id}</span>
                    <span className="text-[#666666] ml-2">PATTERN: {activeCase.case.pattern.toUpperCase()}</span>
                  </div>
                  <div className="border border-white px-2 py-0.5 text-white font-bold">
                    VERDICT: {activeCase.case.verdict.toUpperCase()} (${activeCase.case.exposure_usd.toFixed(2)})
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4 mb-3">
                  <div className="border border-[#1a1a1a] p-2">
                    <span className="text-[10px] text-[#666666] block mb-1">STAGE 1: INITIAL NBA (PRE-EVIDENCE)</span>
                    <div className="text-white font-semibold">
                      {activeCase.next_best_actions.initial.map((a) => `${a.action} [${a.route}]`).join(", ")}
                    </div>
                  </div>
                  <div className="border border-[#1a1a1a] p-2">
                    <span className="text-[10px] text-[#666666] block mb-1">STAGE 2: FINAL NBA (POST-EVIDENCE)</span>
                    <div className="text-white font-semibold">
                      {activeCase.next_best_actions.final.map((a) => `${a.action} [${a.route}]`).join(", ")}
                    </div>
                  </div>
                </div>

                <div className="text-[#888888] text-[11px] leading-relaxed mb-2">
                  <span className="text-white font-bold">WHAT CHANGED: </span>
                  {activeCase.next_best_actions.what_changed}
                </div>

                {activeCase.sar.file && (
                  <div className="border-t border-[#222222] pt-2 mt-2 text-[10px] text-[#aaaaaa]">
                    <span className="text-white font-bold">[REGULATORY SAR FILED]: </span>
                    {activeCase.sar.narrative}
                  </div>
                )}
              </div>
            )}

          </div>

          {/* Footer */}
          <div className="border-t border-[#222222] pt-2 flex items-center justify-between text-[10px] text-[#555555]">
            <span>TEAM MAYDAY // HHGOA 2026</span>
            <span>POWERED BY TIGERGRAPH GSQL & MCP</span>
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
