<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .prompt-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
      background: transparent;
    }
    .prompt-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .prompt-scrollbar::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 4px;
    }
    .prompt-scrollbar:hover::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="bg-black text-white">
  <div id="root" class="h-screen w-screen flex items-center justify-center"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const SPRING_TRANSITION = "max-width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
    const SMOOTH_HEIGHT_TRANSITION = "max-width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), height 0.15s ease-out";

    function cn(...classes) {
      return classes.filter(Boolean).join(" ");
    }

    function MorphingText({ text }) {
      const [width, setWidth] = useState("auto");
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current) {
          setWidth(spanRef.current.offsetWidth);
        }
      }, [text]);
      return (
        <span
          className="relative inline-flex items-center justify-center overflow-hidden transition-all duration-300 ease-[cubic-bezier(0.175,0.885,0.32,1.275)]"
          style={{ width }}
        >
          <span ref={spanRef} className="invisible whitespace-nowrap px-1">
            {text}
          </span>
          <span
            key={text}
            className="absolute inset-0 flex items-center justify-center whitespace-nowrap"
          >
            {text}
          </span>
        </span>
      );
    }

    function ModelIcon({ model, className }) {
      const icons = {
        "Composer 2.5": "https://cdn.21st.dev/assets/mirror/7d/7dc00bc09f225fcda46cbc9c6b669c69c025a231877d6c17baa6a003f04f02b2.svg",
        "Gemini 3.5 Flash": "https://cdn.21st.dev/assets/mirror/cd/cda2df6631d5fa227de3fa04ed78cf354f910ba92a9f086e7455655c10ad9d09.svg",
        "GPT 5.5": "https://cdn.21st.dev/assets/mirror/b9/b93fa7942be639a1dae60194ff12141145d7d9fd59581582d6ff23335755f19c.svg",
        "Opus 4.8": "https://cdn.21st.dev/assets/mirror/5d/5de1221c77cc91e748066fd642ad0eee1c1fa65328814f5178166f901e599709.svg",
        "GLM 5.2": "https://cdn.21st.dev/assets/mirror/b2/b2a6c0ff63efd8a555edf8a174ea6fcfeca120ac1595a2d461ca11d3ae89276c.svg"
      };
      return (
        <img 
          src={icons[model] || icons["GPT 5.5"]} 
          alt={model} 
          className={cn("object-contain invert", className)} 
        />
      );
    }

    function ArrowUpIcon() {
      return (
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 12V2M7 2L2.5 6.5M7 2L11.5 6.5" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    }

    function MicIcon() {
      return (
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="5" y="1" width="4" height="7" rx="2" stroke="currentColor" strokeWidth="1.5" />
          <path d="M2.75 6.5V7a4.25 4.25 0 0 0 8.5 0v-.5M7 11.25V13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
        </svg>
      );
    }

    function StopIcon() {
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" fill="currentColor" />
        </svg>
      );
    }

    function PlusIcon() {
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 2.5V11.5M2.5 7H11.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
        </svg>
      );
    }

    function DynamicBarsIcon({ level }) {
      const isMediumOrHigh = level === "Medium" || level === "Max Effort";
      const isHigh = level === "Max Effort";
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="1.5" y="8" width="2.5" height="4.5" rx="1" fill="currentColor" opacity={1} />
          <rect x="5.75" y="5" width="2.5" height="7.5" rx="1" fill="currentColor" opacity={isMediumOrHigh ? 1 : 0.3} />
          <rect x="10" y="2" width="2.5" height="10.5" rx="1" fill="currentColor" opacity={isHigh ? 1 : 0.3} />
        </svg>
      );
    }

    function PromptInput({
      onSubmit,
      placeholder = "Ask anything",
      className,
      models = ["GPT 5.5", "Opus 4.8", "Gemini 3.5 Flash", "Composer 2.5", "GLM 5.2"],
      efforts = ["Low", "Medium", "Max Effort"],
    }) {
      const [expanded, setExpanded] = useState(false);
      const [isSmoothResize, setIsSmoothResize] = useState(false);
      const [value, setValue] = useState("");
      const [selectedModel, setSelectedModel] = useState(models[0]);
      const [effortIndex, setEffortIndex] = useState(1);
      const [isModelSelectOpen, setIsModelSelectOpen] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [audioData, setAudioData] = useState(new Array(5).fill(0));
      const [containerHeight, setContainerHeight] = useState(116);
      const [textareaHeight, setTextareaHeight] = useState(68);
      const [isScrolling, setIsScrolling] = useState(false);

      const textareaRef = useRef(null);
      const internalContainerRef = useRef(null);
      const topFadeRef = useRef(null);
      const bottomFadeRef = useRef(null);

      const hasValue = value.trim() !== "";

      const updateFades = () => {
        const el = textareaRef.current;
        if (!el) return;
        const { scrollTop, scrollHeight, clientHeight } = el;
        if (topFadeRef.current) {
          topFadeRef.current.style.opacity = Math.min(scrollTop / 20, 1).toString();
        }
        if (bottomFadeRef.current) {
          const bottomScroll = scrollHeight - clientHeight - scrollTop;
          bottomFadeRef.current.style.opacity = Math.min(Math.max(bottomScroll - 16, 0) / 10, 1).toString();
        }
      };

      const handleValueChange = (val) => {
        setIsSmoothResize(true);
        setValue(val);
      };

      const expand = () => {
        setIsSmoothResize(false);
        setExpanded(true);
      };

      useEffect(() => {
        if (value.trim() !== "" && !expanded) {
          setIsSmoothResize(false);
          setExpanded(true);
        }
      }, [value, expanded]);

      useEffect(() => {
        if (expanded && !isRecording && textareaRef.current) {
          textareaRef.current.focus();
        }
      }, [expanded, isRecording]);

      useEffect(() => {
        if (!textareaRef.current) return;
        const el = textareaRef.current;
        const currentHeight = el.style.height;
        el.style.transition = 'none';
        el.style.height = "0px";
        const scrollHeight = el.scrollHeight;
        el.style.height = currentHeight;
        void el.offsetHeight;
        el.style.transition = '';
        
        const newHeight = Math.max(68, Math.min(scrollHeight, 160));
        el.style.height = `${newHeight}px`;
        setTextareaHeight(newHeight);
        setIsScrolling(scrollHeight > 160);
        setTimeout(updateFades, 0);
      }, [value, expanded]);

      useEffect(() => {
        setContainerHeight(Math.max(116, textareaHeight + 48));
        setTimeout(updateFades, 0);
      }, [textareaHeight]);

      useEffect(() => {
        if (!isModelSelectOpen) return;
        const handleOutsideClick = (e) => {
          if (internalContainerRef.current && !internalContainerRef.current.contains(e.target)) {
            setIsModelSelectOpen(false);
          }
        };
        document.addEventListener("mousedown", handleOutsideClick);
        return () => document.removeEventListener("mousedown", handleOutsideClick);
      }, [isModelSelectOpen]);

      const handleBlur = (e) => {
        if (internalContainerRef.current && internalContainerRef.current.contains(e.relatedTarget)) return;
        if (value.trim() === "" && !isRecording) {
          setIsSmoothResize(false);
          setExpanded(false);
          setIsModelSelectOpen(false);
        }
      };

      const handleSubmit = () => {
        if (value.trim() === "") return;
        setIsSmoothResize(false);
        onSubmit?.(value, { model: selectedModel, effort: efforts[effortIndex] });
        handleValueChange("");
        setExpanded(false);
        setIsModelSelectOpen(false);
      };

      const cycleEffort = (e) => {
        e.stopPropagation();
        setEffortIndex((prev) => (prev + 1) % efforts.length);
      };

      const onActionButtonClick = (e) => {
        e.preventDefault();
        if (isRecording) {
          setIsRecording(false);
        } else if (hasValue) {
          handleSubmit();
        } else {
          setIsRecording(true);
          setTimeout(() => setIsRecording(false), 2500);
        }
      };

      return (
        <div
          ref={internalContainerRef}
          onBlur={handleBlur}
          className={cn("relative flex flex-col w-full", className)}
          style={{
            maxWidth: expanded ? 480 : 320,
            transition: isSmoothResize ? "max-width 0.15s ease-out" : "max-width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)",
          }}
        >
          <div
            onMouseDown={(e) => {
              const isTextarea = e.target === textareaRef.current;
              if (expanded && !isTextarea && !isRecording) {
                e.preventDefault();
                textareaRef.current?.focus();
              }
            }}
            style={{
              borderRadius: 24,
              height: expanded ? containerHeight : 48,
              transition: isSmoothResize ? SMOOTH_HEIGHT_TRANSITION : SPRING_TRANSITION,
              overflow: expanded ? "visible" : "hidden",
            }}
            className={cn(
              "relative w-full border border-[#222222] bg-[#000000] focus-within:border-[#444444] hover:border-[#333333] z-10",
              expanded ? "cursor-text" : "cursor-default"
            )}
          >
            <textarea
              ref={textareaRef}
              value={value}
              onChange={(e) => handleValueChange(e.target.value)}
              onScroll={updateFades}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  handleSubmit();
                }
                if (e.key === "Escape" && value.trim() === "") {
                  setIsSmoothResize(false);
                  setExpanded(false);
                  setIsModelSelectOpen(false);
                }
              }}
              placeholder={placeholder}
              aria-label="Prompt"
              disabled={isRecording}
              style={{
                transition: isSmoothResize
                  ? "height 0.15s ease-out"
                  : "opacity 0.3s ease-out, transform 0.3s ease-out, height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)"
              }}
              className={cn(
                "prompt-scrollbar absolute top-0 inset-x-0 z-[1] w-full resize-none bg-transparent pl-4 pr-12 py-3.5 text-sm leading-[22px] text-white outline-none placeholder:text-[#555555] cursor-text",
                expanded ? "opacity-100 scale-100 translate-y-0" : "opacity-0 scale-95 -translate-y-1 pointer-events-none",
                isScrolling ? "overflow-y-auto" : "overflow-y-hidden"
              )}
            />
            <div
              ref={topFadeRef}
              className="absolute left-4 right-12 top-0 z-[2] h-8 bg-gradient-to-b from-black via-black/90 to-transparent pointer-events-none"
            />
            <div
              ref={bottomFadeRef}
              className="absolute left-4 right-12 z-[2] h-8 bg-gradient-to-t from-black via-black/90 to-transparent pointer-events-none"
              style={{ 
                opacity: 0, 
                top: `${textareaHeight - 32}px`,
                transition: isSmoothResize ? "top 0.15s ease-out" : "top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)"
              }}
            />
            <button
              type="button"
              onClick={expand}
              style={{ transition: isSmoothResize ? "none" : "all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)" }}
              className={cn(
                "absolute inset-x-0 top-0 z-[1] cursor-text pl-4 pr-12 py-[15px] text-left text-sm font-medium leading-[17px] text-[#666666] outline-none",
                !expanded ? "opacity-100 scale-100 translate-y-0" : "opacity-0 scale-105 translate-y-1 pointer-events-none"
              )}
            >
              {placeholder}
            </button>

            {/* Bottom Actions Wrapper */}
            <div
              className={cn(
                "absolute bottom-2 left-3 right-12 z-[10] flex items-center gap-0 transition-all duration-300 ease-[cubic-bezier(0.175,0.885,0.32,1.275)]",
                expanded && !isRecording ? "opacity-100 translate-y-0 pointer-events-auto" : "opacity-0 translate-y-2 pointer-events-none"
              )}
            >
              <div className="relative">
                <button
                  type="button"
                  onMouseDown={(e) => e.preventDefault()} 
                  onClick={(e) => {
                    e.stopPropagation();
                    setIsModelSelectOpen((prev) => !prev);
                  }}
                  className={cn(
                    "group flex items-center gap-1 rounded-full px-2 py-1 text-white/50 transition-all duration-200 outline-none hover:bg-[#111111] hover:text-white cursor-default",
                    isModelSelectOpen ? "bg-[#111111] text-white" : ""
                  )}
                >
                  <ModelIcon model={selectedModel} className="size-3.5 opacity-70 group-hover:opacity-100" />
                  <span className="text-xs font-semibold select-none">
                    <MorphingText text={selectedModel} />
                  </span>
                </button>
                <div
                  className={cn(
                    "absolute bottom-full left-0 mb-2.5 z-50 w-44 rounded-2xl border border-[#222222] bg-[#000000] p-1 shadow-2xl flex flex-col gap-0.5 transition-all duration-400 cursor-default",
                    isModelSelectOpen
                      ? "opacity-100 scale-100 translate-y-0 pointer-events-auto"
                      : "opacity-0 scale-95 translate-y-3 pointer-events-none"
                  )}
                >
                  <div className="relative flex flex-col gap-0.5">
                    {models.map((model) => (
                      <button
                        key={model}
                        type="button"
                        onMouseDown={(e) => e.preventDefault()}
                        onClick={(e) => { e.stopPropagation(); setSelectedModel(model); setIsModelSelectOpen(false); }}
                        className="group relative flex h-8 w-full items-center justify-between rounded-xl px-2.5 py-1.5 text-left text-xs font-medium text-white/80 hover:bg-[#111111] hover:text-white outline-none cursor-default"
                      >
                        <span className="flex items-center gap-2">
                          <ModelIcon model={model} className="size-3.5 opacity-85 group-hover:opacity-100" />
                          {model}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <button
                type="button" onMouseDown={(e) => e.preventDefault()} onClick={cycleEffort}
                className="group flex items-center gap-1 rounded-full px-2 py-1 text-white/50 transition-all duration-200 hover:bg-[#111111] hover:text-white outline-none cursor-default"
              >
                <DynamicBarsIcon level={efforts[effortIndex]} />
                <span className="text-xs font-semibold select-none"><MorphingText text={efforts[effortIndex]} /></span>
              </button>
            </div>

            <button
              type="button"
              onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); }} 
              onClick={onActionButtonClick}
              style={{ borderRadius: 9999 }}
              className="absolute right-2 bottom-2 z-[10] flex h-8 w-8 items-center justify-center bg-white text-black hover:bg-[#dddddd] transition-all outline-none cursor-default"
            >
              <span className="relative flex h-full w-full items-center justify-center">
                <span className={cn("absolute inset-0 flex items-center justify-center transition-all duration-300", hasValue ? "opacity-100 scale-100" : "opacity-0 scale-50 pointer-events-none")}>
                  <ArrowUpIcon />
                </span>
                <span className={cn("absolute inset-0 flex items-center justify-center transition-all duration-300", !hasValue ? "opacity-100 scale-100" : "opacity-0 scale-50 pointer-events-none")}>
                  <MicIcon />
                </span>
              </span>
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const handleSendMessage = (message, meta) => {
        console.log("Message:", message, "Meta:", meta);
      };

      return (
        <div className="flex h-screen w-screen items-center justify-center bg-black">
          <PromptInput onSubmit={handleSendMessage} placeholder="Ask anything" />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
